spring.application.name=lanchonete-api

# --- H2 (desenvolvimento) ---
spring.datasource.url=jdbc:h2:mem:lanchonete;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# --- PostgreSQL (descomente e comente o bloco H2) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/lanchonete
# spring.datasource.username=postgres
# spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# false: força o mapeamento para DTO dentro da transação do Service (sem lazy loading escondido no Controller)
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
